services:
  web:
    build:
      context: ../..
      dockerfile: examples/django-templates/Dockerfile
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_demo && python manage.py runserver 0.0.0.0:8000"
    ports: ["8000:8000"]
    volumes: ["data:/app/data"]

  worker:
    build:
      context: ../..
      dockerfile: examples/django-templates/Dockerfile
    # Sends the queued pushes and emails. Emails are printed here.
    command: sh -c "sleep 3 && python manage.py notify_worker"
    volumes: ["data:/app/data"]
    depends_on: [web]

volumes:
  data:
