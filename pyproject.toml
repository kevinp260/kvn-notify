[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kvn-notify"
version = "0.1.0"
description = "Push notifications and emails for Django. Declared once, sent with one line, never lost."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kevin Piranjani" }]
requires-python = ">=3.10"
dependencies = [
    "Django>=5.1",
    "pywebpush>=2.0",
]
keywords = ["django", "web push", "notifications", "pwa", "email", "vapid"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
    "Topic :: Internet :: WWW/HTTP",
]

[project.optional-dependencies]
icons = ["Pillow>=10"]
drf = ["djangorestframework>=3.15"]
celery = ["celery>=5.3"]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
    "Pillow>=10",
    "djangorestframework>=3.15",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/kevinp260/kvn-notify"
Documentation = "https://kevinp260.github.io/kvn-notify/"
Issues = "https://github.com/kevinp260/kvn-notify/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kvn_notify"]

[tool.hatch.build.targets.sdist]
include = ["src/kvn_notify", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["src/kvn_notify/migrations"]

[tool.ruff.format]
# Docs pull code in with "--8<--" lines, which the formatter would break.
exclude = ["docs/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]

[tool.ruff.lint.isort]
known-first-party = ["kvn_notify", "tests", "project", "demo", "api"]
