<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{% block subject %}{{ title }}{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;">
{# Inline styles only: Gmail and Outlook drop most <style> blocks. #}
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f4f5f7;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;background-color:#ffffff;border-radius:8px;border:1px solid #e3e5e8;">
        {% block header %}
        {% if brand.LOGO_URL or brand.BRAND_NAME %}
        <tr>
          <td style="padding:24px 32px 0 32px;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:bold;color:#111827;">
            {% if brand.LOGO_URL %}<img src="{{ brand.LOGO_URL }}" alt="{{ brand.BRAND_NAME }}" height="32" style="display:block;height:32px;border:0;">{% else %}{{ brand.BRAND_NAME }}{% endif %}
          </td>
        </tr>
        {% endif %}
        {% endblock %}
        <tr>
          <td style="padding:24px 32px 8px 32px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#111827;">
            {% block content %}
            <h1 style="margin:0 0 12px 0;font-size:20px;line-height:1.3;color:#111827;">{{ title }}</h1>
            {% if body %}<p style="margin:0;">{{ body|linebreaksbr }}</p>{% endif %}
            {% endblock %}
          </td>
        </tr>
        {% block action %}
        {% if action_url %}
        <tr>
          <td style="padding:16px 32px 8px 32px;">
            <a href="{{ action_url }}" style="display:inline-block;padding:10px 20px;background-color:{{ brand.PRIMARY_COLOR }};color:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:bold;text-decoration:none;border-radius:6px;">{% block action_label %}Open{% endblock %}</a>
          </td>
        </tr>
        {% endif %}
        {% endblock %}
        <tr><td style="padding:16px 32px 0 32px;"></td></tr>
      </table>
      {% block footer %}
      {% if brand.FOOTER_TEXT %}
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;">
        <tr>
          <td style="padding:16px 32px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#6b7280;text-align:center;">{{ brand.FOOTER_TEXT }}</td>
        </tr>
      </table>
      {% endif %}
      {% endblock %}
    </td>
  </tr>
</table>
</body>
</html>
